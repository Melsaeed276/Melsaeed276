<svg xmlns="http://www.w3.org/2000/svg" width="920" height="210" viewBox="0 0 920 210" role="img" aria-label="PageSpeed Insights: Performance 93, Accessibility 99, Best Practices 100, SEO 100">
  <defs>
    <style>
      .title { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Arial, sans-serif; fill: #111827; }
      .label { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Arial, sans-serif; fill: #374151; }
      .score { font: 800 28px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Arial, sans-serif; fill: #16a34a; }
      .muted { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Arial, sans-serif; fill: #6b7280; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="920" height="210" rx="16" fill="#ffffff" filter="url(#shadow)"/>

  <text x="28" y="38" class="title">PageSpeed Insights</text>
  <text x="28" y="62" class="muted">Snapshot scores (2026-08-11)</text>

  <!-- circles -->
  <!-- Common styles -->
  <!-- Background ring -->
  <!-- Foreground ring (full ring to match green circle look) -->

  <!-- Performance -->
  <g transform="translate(110 120)">
    <circle r="54" cx="0" cy="0" fill="none" stroke="#e5e7eb" stroke-width="12"/>
    <circle r="54" cx="0" cy="0" fill="none" stroke="#22c55e" stroke-width="12"/>
    <text x="0" y="10" text-anchor="middle" class="score">93</text>
    <text x="0" y="82" text-anchor="middle" class="label">Performance</text>
  </g>

  <!-- Accessibility -->
  <g transform="translate(330 120)">
    <circle r="54" cx="0" cy="0" fill="none" stroke="#e5e7eb" stroke-width="12"/>
    <circle r="54" cx="0" cy="0" fill="none" stroke="#22c55e" stroke-width="12"/>
    <text x="0" y="10" text-anchor="middle" class="score">99</text>
    <text x="0" y="82" text-anchor="middle" class="label">Accessibility</text>
  </g>

  <!-- Best Practices -->
  <g transform="translate(550 120)">
    <circle r="54" cx="0" cy="0" fill="none" stroke="#e5e7eb" stroke-width="12"/>
    <circle r="54" cx="0" cy="0" fill="none" stroke="#22c55e" stroke-width="12"/>
    <text x="0" y="10" text-anchor="middle" class="score">100</text>
    <text x="0" y="82" text-anchor="middle" class="label">Best Practices</text>
  </g>

  <!-- SEO -->
  <g transform="translate(770 120)">
    <circle r="54" cx="0" cy="0" fill="none" stroke="#e5e7eb" stroke-width="12"/>
    <circle r="54" cx="0" cy="0" fill="none" stroke="#22c55e" stroke-width="12"/>
    <text x="0" y="10" text-anchor="middle" class="score">100</text>
    <text x="0" y="82" text-anchor="middle" class="label">SEO</text>
  </g>
</svg>
